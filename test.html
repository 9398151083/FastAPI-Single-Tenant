<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>💬 Group Chat Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        #chat {
            background: white;
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        .system {
            color: gray;
            font-style: italic;
        }

        .me {
            color: green;
        }

        .other {
            color: blue;
        }

        input,
        button {
            padding: 8px;
            margin: 4px 0;
            width: 100%;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>💬 Group Chat</h2>

    <label>JWT Token</label>
    <input id="token" placeholder="Paste JWT token here" />

    <label>Group ID</label>
    <input id="groupId" placeholder="Enter group_id" />

    <button onclick="connect()">Connect</button>

    <p id="status">⚪ Disconnected</p>

    <div id="chat"></div>

    <input id="message" placeholder="Type message..." />
    <button onclick="sendMessage()">Send</button>

    <script>
        let socket = null;

        function logMessage(text, className = "") {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.textContent = text;
            div.className = className;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function connect() {
            const token = document.getElementById("token").value.trim();
            const groupId = document.getElementById("groupId").value.trim();

            if (!token || !groupId) {
                alert("JWT token and Group ID are required");
                return;
            }
            //token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwZmEyMzUxNy02YjFkLTQ0OWItODdiYy0yOGY2OTU5OGY3NWMiLCJleHAiOjE3Njk0MTMxNzUsInR5cGUiOiJhY2Nlc3MifQ.1tycG8_luXI8CRzYrV3J5-j2p7rdljKGBhDcFSN_jY8"
            //groupId = "500ed403-dc02-45f8-9d57-7d0b2e080305"
            const url = `ws://localhost:8000/ws/groups/${groupId}?token=${token}`;
            socket = new WebSocket(url);

            socket.onopen = () => {
                document.getElementById("status").innerText = "🟢 Connected";
                logMessage("Connected to group", "system");
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === "system") {
                    logMessage(data.message, "system");
                } else if (data.type === "message") {
                    logMessage(`${data.from_name}: ${data.message}`, "other");
                } else if (data.type === "error") {
                    logMessage(`❌ ${data.message}`, "system");
                }
            };

            socket.onerror = () => {
                document.getElementById("status").innerText = "🔴 Error";
                logMessage("Connection error", "system");
            };

            socket.onclose = () => {
                document.getElementById("status").innerText = "⚪ Disconnected";
                logMessage("Disconnected from server", "system");
            };
        }

        function sendMessage() {
            const input = document.getElementById("message");
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert("Not connected");
                return;
            }

            socket.send(JSON.stringify({ message: input.value }));
            logMessage(`Me: ${input.value}`, "me");
            input.value = "";
        }
    </script>

</body>

</html>
