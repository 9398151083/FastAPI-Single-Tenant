<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Group Chat + Notifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .chat-container {
            width: 420px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            padding: 15px;
        }

        .status {
            font-size: 13px;
            margin-bottom: 8px;
            color: #555;
        }

        .messages {
            height: 260px;
            border: 1px solid #ddd;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .msg {
            margin-bottom: 6px;
        }

        .system {
            color: #888;
            font-style: italic;
        }

        .input-row {
            display: flex;
        }

        input {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            margin-left: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <h3>💬 Group Chat</h3>

        <div class="status" id="status">Disconnected</div>

        <div class="messages" id="messages"></div>

        <div class="input-row">
            <input id="messageInput" placeholder="Type message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // 🔧 CONFIG
        const GROUP_ID = "500ed403-dc02-45f8-9d57-7d0b2e080305"
        const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwZmEyMzUxNy02YjFkLTQ0OWItODdiYy0yOGY2OTU5OGY3NWMiLCJleHAiOjE3NjkxMDgyODIsInR5cGUiOiJhY2Nlc3MifQ.NK92RRG2bYOu__cVs0wLk2OhTEGBYZudBDCaiHyDFDc"
        const WS_URL = `ws://localhost:8002/ws/groups/${GROUP_ID}?token=${TOKEN}`

        const statusEl = document.getElementById("status")
        const messagesEl = document.getElementById("messages")
        const inputEl = document.getElementById("messageInput")

        let socket = null

        function logMessage(text, cls = "msg") {
            const div = document.createElement("div")
            div.className = cls
            div.textContent = text
            messagesEl.appendChild(div)
            messagesEl.scrollTop = messagesEl.scrollHeight
        }

        function connect() {
            socket = new WebSocket(WS_URL)

            socket.onopen = () => {
                statusEl.textContent = "🟢 Connected"
                logMessage("You joined the group", "system")
            }

            socket.onmessage = (event) => {
                logMessage(event.data)
            }

            socket.onerror = () => {
                statusEl.textContent = "🔴 Error"
                logMessage("Connection error", "system")
            }

            socket.onclose = () => {
                statusEl.textContent = "⚪ Disconnected"
                logMessage("Disconnected from server", "system")
            }
        }

        function sendMessage() {
            const text = inputEl.value.trim()
            if (!text || !socket || socket.readyState !== 1) return

            socket.send(text)
            inputEl.value = ""
        }

        inputEl.addEventListener("keypress", e => {
            if (e.key === "Enter") sendMessage()
        })

        // 🚀 Auto connect
        connect()
    </script>

</body>

</html>
